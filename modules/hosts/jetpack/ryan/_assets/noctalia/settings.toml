config_version = 8

[bar.default]
background_opacity = 0.59999998658895493
concave_edge_corners = false
margin_edge = 8
margin_ends = 8

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-3" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
    box_height = 229.0
    box_width = 810.0
    cx = 2560.0
    cy = 1241.5
    output = "DP-3"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_weather = true

[shell]
button_borders = false
card_borders = false
input_borders = false
popup_borders = false

[theme]
builtin = "Kanagawa"
community_palette = "Cream"
source = "community"

[wallpaper]
enabled = false

    [wallpaper.default]
    path = "/nix/store/85mhadiaq7c343rk75z14ym9vldx0pbf-noctalia-5.0.0/share/noctalia/assets/noctalia-wallpaper.png"

    [wallpaper.last]
    path = "/nix/store/85mhadiaq7c343rk75z14ym9vldx0pbf-noctalia-5.0.0/share/noctalia/assets/noctalia-wallpaper.png"