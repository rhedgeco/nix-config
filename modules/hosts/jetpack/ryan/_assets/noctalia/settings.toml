config_version = 8

[shell]
button_borders = false
card_borders = false
input_borders = false
popup_borders = false
font_family = "JetBrainsMono NF"
lang = "en"
password_style = "random"
polkit_agent = true

[shell.panel]
borders = false
control_center_placement = "floating"
open_near_click_control_center = true
transparency_mode = "soft"
open_near_click_session = true

[widget.audio_visualizer_1]
show_when_idle = false
bands = 64
interactive = false
type = "audio_visualizer"
width = 215

[widget.audio_visualizer_2]
show_when_idle = false
bands = 64
interactive = false
type = "audio_visualizer"
width = 215

[widget.ram]
display = "graph"

[widget.audio_visualizer]
bands = 128
show_when_idle = true
width = 400

[widget.clock]
format = "{:%A, %B %d - %H:%M:%S}"
anchor = true

[widget.cpu]
display = "graph"

[widget.network]
show_label = false

[widget.workspaces]
display = "none"

[bar.default]
background_opacity = 0.5999999865889549
concave_edge_corners = false
margin_edge = 6
margin_ends = 6
center = ["audio_visualizer_1", "power_profile", "clock", "notifications", "audio_visualizer_2"]
end = ["tray", "settings", "bluetooth", "network", "volume", "brightness", "battery", "session"]
start = ["workspaces", "cpu", "ram", "temp"]
widget_spacing = 14

[calendar]
enabled = true

[calendar.account.personal_google]
color = "primary"
name = "Google Calendar"
type = "google"

