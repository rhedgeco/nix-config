config_version = 8

[shell]
button_borders = false
card_borders = false
input_borders = false
popup_borders = false
font_family = "JetBrainsMono NF"
lang = "en"

[shell.panel]
borders = false
control_center_placement = "floating"
open_near_click_control_center = true
transparency_mode = "soft"
open_near_click_session = true

[widget.audio_visualizer_1]
show_when_idle = false
bands = 64
interactive = false
type = "audio_visualizer"
width = 215

[widget.audio_visualizer_2]
show_when_idle = false
bands = 64
interactive = false
type = "audio_visualizer"
width = 215

[widget.ram]
display = "graph"

[widget.audio_visualizer]
bands = 128
show_when_idle = true
width = 400

[widget.clock]
format = "{:%A, %B %d - %H:%M:%S}"
anchor = true

[widget.cpu]
display = "graph"

[widget.network]
show_label = false

[widget.workspaces]
display = "none"

[bar.default]
background_opacity = 0.5999999865889549
concave_edge_corners = false
margin_edge = 6
margin_ends = 6
center = ["audio_visualizer_1", "power_profile", "clock", "notifications", "audio_visualizer_2"]
end = ["tray", "settings", "bluetooth", "network", "volume", "brightness", "battery", "session"]
start = ["workspaces", "cpu", "ram", "temp"]
widget_spacing = 14

[calendar]
enabled = true

[calendar.account.personal_google]
color = "primary"
name = "Google Calendar"
type = "google"

[lockscreen]
blurred_desktop = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = ["lockscreen-login-box@eDP-1", "lockscreen-login-box@DP-3"]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
box_height = 229.0
box_width = 810.0
cx = 2560.0
cy = 1241.5
output = "DP-3"
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
background_color = "surface_variant"
background_opacity = 0.88
background_radius = 12.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
layout = "regular"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_media = true
show_session_buttons = true
show_weather = true

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
box_height = 229.0
box_width = 810.0
cx = 800.0
cy = 868.5
output = "eDP-1"
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
background_color = "surface_variant"
background_opacity = 0.88
background_radius = 12.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
layout = "regular"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_media = true
show_session_buttons = true
show_weather = true

[notification]
background_opacity = 0.7499999832361937
position = "top_center"
border = false

[osd]
border = false

[control_center]
sidebar = "full"
sidebar_section = "full"
hidden_tabs = ["weather", "screen-time"]

[theme]
custom_palette = "Cream"
source = "custom"
